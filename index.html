<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dryfroots | Quick Links</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="premium-card">
        <div class="logo-outer">
            <div class="logo-inner">
                <img src="assets/logo-circle.jpeg" alt="Logo">
            </div>
        </div>

        <img src="assets/logo-text.jpg" alt="Dryfroots" class="brand-wordmark">
        <div class="tagline">Flavor Revolution In Every Bite</div>
        
        <div class="section-header">
            <div class="line"></div>
            <span>Connect With Us</span>
            <div class="line"></div>
        </div>

        <div class="links-stack">
            <a id="link-instagram" href="#" target="_blank" class="btn-premium">
                <div class="icon-box"><i class="fab fa-instagram"></i></div>
                <div class="btn-text">
                    <span class="btn-title">Instagram</span>
                    <span class="btn-subtitle">Sneak peeks & updates</span>
                </div>
            </a>

            <a id="link-whatsapp" href="#" target="_blank" class="btn-premium">
                <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
                <div class="btn-text">
                    <span class="btn-title">Order on WhatsApp</span>
                    <span class="btn-subtitle">Freshly packed for you</span>
                </div>
            </a>

            <a id="link-contact" href="#" class="btn-premium">
                <div class="icon-box"><i class="fas fa-phone"></i></div>
                <div class="btn-text">
                    <span class="btn-title">Direct Contact</span>
                    <span class="btn-subtitle">Available 10 AM - 8 PM</span>
                </div>
            </a>

            <a id="link-catalogue" href="#" target="_blank" class="btn-premium">
                <div class="icon-box"><i class="fas fa-file-pdf"></i></div>
                <div class="btn-text">
                    <span class="btn-title">Product Catalogue</span>
                    <span class="btn-subtitle">Explore our full range</span>
                </div>
            </a>
        </div>

        <footer>2026 Dryfroots Official</footer>
    </div>

    <script src="config.js"></script>
</body>
</html>
